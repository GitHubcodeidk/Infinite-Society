  // Unlocking needs a secure context, and the domain also answers on plain http until "Enforce HTTPS" is on.
  if (location.protocol === "http:" && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname))
    location.replace("https://" + location.host + location.pathname + location.search + location.hash);
  // Image first, then text: the photograph fades in once it has arrived (not on a fixed clock, which on a slow
  // phone would fade in black), and the text follows it, or comes on its own after 1.5 s.
  (function () {
    var root = document.documentElement, done = function () { root.classList.add("ready"); };
    var img = new Image(); img.onload = img.onerror = done;
    img.src = matchMedia("(max-aspect-ratio: 4/5)").matches ? "assets/bg/airglow-portrait.webp" : "assets/bg/airglow-2560.webp";
    setTimeout(function () { root.classList.add("late"); }, 1500);
    setTimeout(done, 4000);
  })();
</script>

<style>
  @font-face { font-family: "Cormorant Garamond"; font-weight: 300; font-style: normal; font-display: swap; src: url("assets/fonts/cormorant-300.woff2") format("woff2"); }
  @font-face { font-family: "Cormorant Garamond"; font-weight: 300; font-style: italic; font-display: swap; src: url("assets/fonts/cormorant-300i.woff2") format("woff2"); }
  :root {
    --gold: #d89a3a;                    /* round three's gold, rejected for the gate; only old types name it */
    --title-color: #f7efe3;             /* defaults are C3 ivory, so a build that names no colour never ships gold */
    --rule: rgba(247, 239, 227, .5);    /* the box's hairline */
    --ink: #f7efe3;                     /* what is typed */
    --hint: rgba(247, 239, 227, .72);   /* the placeholder */
    --image: none; --fade: none;
    --size: cover; --size-tall: cover;
    --pos: 50% 50%; --pos-tall: 50% 50%;
    --y: 50%; --y-tall: 50%;            /* where the block sits: its centre by default ... */
    --top: var(--y); --top-tall: var(--y-tall);
    --shift: -50%;                      /* ... or its top edge, when a look sets --shift: 0% */
    --dx: 0px; --dx-tall: 0px;
    --shade: none; --shade-tall: var(--shade);
    /* Type: fixed sizes at three widths, never scaled with the viewport. */
    --title-font: Georgia, serif; --title-weight: 400; --title-style: normal; --title-case: none;
    --title-track: 0em; --title-leading: 1.08;
    --ts-phone: 30px; --ts-tablet: 44px; --ts-desktop: 60px;
    --ls1: 0em; --ls2: 0em;             /* per-line tracking for a two-line title */
    --field-font: Georgia, serif; --field-style: italic; --field-weight: 400; --field-size: 20px; --field-track: .04em;
    --box: 100%;                        /* the box's width as a share of the title's width */
    --box-h: 44px; --gap: 20px;         /* a light box under light capitals: the name stays the heavier thing */
  }
  @media (min-width: 600px) { :root { --gap: 24px; } }
  @media (min-width: 1024px) { :root { --gap: 28px; } }
  :root { --title-font: 'Cormorant Garamond', Georgia, serif; --title-weight: 300; --title-case: uppercase; --title-track: .3em; --ts-phone: 22px; --ts-tablet: 32px; --ts-desktop: 40px; --field-font: 'Cormorant Garamond', Georgia, serif; --field-style: italic; --field-weight: 300; --field-size: 21px; --field-track: .03em; --title-color: #f7efe3; --ink: #f7efe3; --rule: rgba(247,239,227,.5); --hint: rgba(247,239,227,.72); }
  :root { --image: url("assets/bg/airglow-2560.webp"); --image-tall: url("assets/bg/airglow-portrait.webp"); --pos: 50% 60%; --pos-tall: 30% 50%; --y: 26%; --y-tall: 28%; --shift: 0%; --top: 12%; --top-tall: 11%; --shade: radial-gradient(ellipse 50% 34% at 50% 22%, rgba(0,0,0,.5), rgba(0,0,0,.3) 48%, rgba(0,0,0,0) 100%); --shade-tall: radial-gradient(ellipse 95% 26% at 50% 19%, rgba(0,0,0,.46), rgba(0,0,0,0) 100%); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: #000; }
  body { color: var(--ink); overflow: hidden; }
  .sky { position: fixed; inset: 0; background-color: #000; background-image: var(--fade), var(--image);
         background-position: var(--pos); background-size: var(--size); background-repeat: no-repeat;
         animation: arrive 1.4s ease-out both paused; }
  .ready .sky { animation-play-state: running; }
  .sky::after { content: ""; position: absolute; inset: 0; background: var(--shade); }
  main { position: fixed; left: 0; right: 0; top: var(--top); transform: translate(var(--dx), var(--shift));
         display: flex; justify-content: center; padding: 0 16px; animation: arrive-text 1s ease-out .35s both paused; }
  .ready main, .late main { animation-play-state: running; }
  .block { display: flex; flex-direction: column; align-items: center; gap: var(--gap); max-width: 100%; }
  h1 { margin: 0; font-family: var(--title-font); font-weight: var(--title-weight); font-style: var(--title-style);
       font-size: var(--ts-phone); line-height: var(--title-leading); text-transform: var(--title-case);
       letter-spacing: var(--title-track); margin-right: calc(-1 * var(--title-track)); /* drop the trailing track */
       color: var(--title-color); text-align: center; white-space: nowrap; font-kerning: normal;
       text-shadow: 0 0 18px rgba(0, 0, 0, .45); }
  .stack h1 span { display: block; }
  .stack h1 .w1 { letter-spacing: var(--ls1); margin-right: calc(-1 * var(--ls1)); }
  .stack h1 .w2 { letter-spacing: var(--ls2); margin-right: calc(-1 * var(--ls2)); }
  @media (min-width: 600px) { h1 { font-size: var(--ts-tablet); } }
  @media (min-width: 1024px) { h1 { font-size: var(--ts-desktop); } }
  @media (max-width: 359px) { h1 { font-size: calc(var(--ts-phone) * .88); } }
  form { position: relative; width: var(--box); min-width: 248px; }
  input { display: block; width: 100%; height: var(--box-h); margin: 0; padding: 0 var(--box-h); outline: none;
          border: 1px solid var(--rule); border-radius: 0; background: rgba(4, 6, 12, .32);
          -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); color: var(--ink); text-align: center;
          font-family: var(--field-font); font-style: var(--field-style); font-weight: var(--field-weight);
          font-size: var(--field-size); letter-spacing: var(--field-track); line-height: 1;
          -webkit-appearance: none; appearance: none; transition: border-color .2s, opacity .2s; }
  input::placeholder { color: var(--hint); opacity: 1; }
  input:focus { border-color: var(--title-color); outline: 1px solid var(--rule); outline-offset: 3px; }
  button { position: absolute; top: 0; right: 0; width: var(--box-h); height: var(--box-h); padding: 0; border: 0;
           border-left: 1px solid var(--rule); background: transparent; color: var(--title-color);
           font: 400 20px/1 Georgia, serif; cursor: pointer; opacity: 0; visibility: hidden;
           transition: opacity .25s, visibility 0s .25s; }
  /* the arrow comes with the first letter; until then it is out of sight and out of the tab order */
  input:not(:placeholder-shown) + button { opacity: 1; visibility: visible; transition: opacity .25s; }
  button:focus-visible { outline: 1px solid var(--title-color); outline-offset: -5px; }
  .busy input { opacity: .6; }
  .wrong input { border-color: #d0705f; animation: shake .4s; }
  @keyframes shake { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }
  @keyframes arrive { from { opacity: 0; } }
  @keyframes arrive-text { from { opacity: 0; transform: translate(var(--dx), calc(var(--shift) + 8px)); } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  @media (max-aspect-ratio: 4/5) {
    .sky { background-image: var(--fade), var(--image-tall, var(--image)); background-position: var(--pos-tall); background-size: var(--size-tall); }
    .sky::after { background: var(--shade-tall); }
    main { top: var(--top-tall); transform: translate(var(--dx-tall), var(--shift)); }
  }
  @media (prefers-reduced-motion: reduce) { .sky, main, .wrong input { animation: none; } }
</style>

  if (!subtle) { input.disabled = true; input.placeholder = "please update your browser"; return; }

  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const base64 = b => btoa(String.fromCharCode.apply(null, new Uint8Array(b)));
  const normalize = s => s.toLowerCase().replace(/\s+/g, "");
  const unseal = async key => new TextDecoder().decode(
    await subtle.decrypt({ name: "AES-GCM", iv: bytes(sealed.iv) }, key, bytes(sealed.ct)));
  const derive = async password => subtle.deriveKey(
    { name: "PBKDF2", hash: "SHA-256", salt: bytes(sealed.salt), iterations: sealed.iter },
    await subtle.importKey("raw", new TextEncoder().encode(normalize(password)), "PBKDF2", false, ["deriveKey"]),
    { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  // Replace the whole document, but only once this one has finished parsing: a write while the parser
  // is still running would be inserted into the gate instead of replacing it.
  const show = html => {
    const replace = () => { document.open(); document.write(html); document.close(); };
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", replace, { once: true });
    else replace();
  };
  // After the right password the gate fades into the next page's ground, then the page comes in and plays its
  // own opening. (A reload that reuses the kept key goes straight in.)
  // 600 ms, linear: every frame of it visibly changing, then the page is written at once onto its own ground
  // (rgb 14 17 15), so the hand-over has no stretch of dead black and no step from black to that ground.
  const FADE = { ms: 500, ease: "linear", swapAt: 500, ground: "#0e110f" };
  const leave = html => {
    const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
    document.documentElement.style.background = FADE.ground;
    document.body.style.transition = `opacity ${FADE.ms}ms ${FADE.ease}`;
    document.body.style.opacity = "0";
    setTimeout(() => show(html), reduce ? 0 : FADE.swapAt);
  };

  // Unlocked earlier in this tab: reuse the key and skip the prompt.
  try {
    const kept = JSON.parse(sessionStorage.getItem(STORE) || "null");
    if (kept && kept.salt === sealed.salt)
      subtle.importKey("raw", bytes(kept.key), "AES-GCM", false, ["decrypt"]).then(unseal).then(show)
        .catch(() => { try { sessionStorage.removeItem(STORE); } catch (e) {} });
  } catch (e) {}

  form.addEventListener("submit", async event => {
    event.preventDefault();
    if (!input.value || form.classList.contains("busy")) return;
    form.classList.remove("wrong");
    form.classList.add("busy");
    try {
      const key = await derive(input.value);
      const html = await unseal(key);
      try {
        sessionStorage.setItem(STORE, JSON.stringify({ salt: sealed.salt, key: base64(await subtle.exportKey("raw", key)) }));
      } catch (e) {}
      leave(html);
    } catch (e) {
      form.classList.remove("busy");
      input.value = "";
      input.placeholder = "incorrect password"; // visible even with motion reduced, where there is no shake
      void form.offsetWidth; // restart the shake
      form.classList.add("wrong");
      live.textContent = "";
      setTimeout(() => { live.textContent = "Incorrect password"; }, 60); // announced again on every miss
      input.focus();
    }
  });
  input.addEventListener("input", () => { input.placeholder = "password"; form.classList.remove("wrong"); });
})();
</script>
</body>
</html>
